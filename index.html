<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Exam Bit Catcher Game</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: #090d16;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .game-container {
            position: relative;
            width: 750px;
            height: 500px;
            background: #111827;
            border: 6px solid #1f2937;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1f2937;
            padding: 14px 24px;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 600;
        }

        .score-box span {
            color: #38bdf8;
        }

        .lives-box {
            color: #ef4444;
            font-size: 22px;
        }

        /* Classroom Arena */
        .arena {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            height: 220px;
            border-radius: 16px;
            padding: 0 40px;
            border: 2px dashed #374151;
        }

        .character {
            text-align: center;
            transition: transform 0.2s;
        }

        .char-emoji {
            font-size: 90px;
        }

        .char-name {
            font-size: 14px;
            color: #9ca3af;
            margin-top: 4px;
            text-transform: uppercase;
        }

        /* Alert Notification Banner */
        .alert-banner {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            height: 35px;
            letter-spacing: 0.5px;
        }

        /* Control Button */
        .action-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            font-family: inherit;
            font-size: 22px;
            font-weight: 700;
            padding: 16px;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.4);
            transition: transform 0.1s, background 0.2s;
        }

        .action-btn:active {
            transform: scale(0.97);
        }

        .action-btn.danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.4);
        }

        /* Overlay Screens */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 15, 25, 0.94);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            z-index: 20;
            border-radius: 20px;
        }

        .overlay h1 {
            font-size: 38px;
            color: #38bdf8;
            margin-bottom: 12px;
        }

        .overlay p {
            color: #9ca3af;
            font-size: 16px;
            max-width: 420px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .start-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            font-family: inherit;
            font-size: 20px;
            font-weight: 700;
            padding: 14px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }
    </style>
</head>
<body>

    <div class="game-container">
        
        <!-- Header Info -->
        <div class="top-bar">
            <div class="score-box">Bits Copied: <span id="score">0</span> / 10</div>
            <div class="lives-box" id="lives-display">❤️❤️❤️</div>
        </div>

        <!-- Alert Message -->
        <div id="alert-banner" class="alert-banner" style="color: #10b981;">
            Teacher is looking away. Safe to grab bit!
        </div>

        <!-- Arena Scene -->
        <div class="arena">
            <!-- Student -->
            <div class="character">
                <div id="student-emoji" class="char-emoji">🧑‍🎓</div>
                <div class="char-name">You (Student)</div>
            </div>

            <div style="font-size: 30px; color: #4b5563;">⚡</div>

            <!-- Teacher -->
            <div class="character">
                <div id="teacher-emoji" class="char-emoji">👨‍🏫</div>
                <div class="char-name">Invigilator</div>
            </div>
        </div>

        <!-- Action Button -->
        <button id="cheat-btn" class="action-btn" onmousedown="startCheating()" onmouseup="stopCheating()" ontouchstart="startCheating()" ontouchend="stopCheating()">
            HOLD TO PULL BIT (COPY)
        </button>

        <!-- Start / Game Over Overlay -->
        <div id="overlay" class="overlay">
            <h1 id="overlay-title">📝 The Exam Bit Catcher</h1>
            <p id="overlay-desc">Hold the button to copy from your bit when the teacher is looking away. Release immediately before the teacher turns around and catches you!</p>
            <button class="start-btn" onclick="startGame()">START EXAM</button>
        </div>

    </div>

    <script>
        const scoreDisplay = document.getElementById('score');
        const livesDisplay = document.getElementById('lives-display');
        const alertBanner = document.getElementById('alert-banner');
        const studentEmoji = document.getElementById('student-emoji');
        const teacherEmoji = document.getElementById('teacher-emoji');
        const cheatBtn = document.getElementById('cheat-btn');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayDesc = document.getElementById('overlay-desc');

        let score = 0;
        let lives = 3;
        let isCheating = false;
        let isTeacherWatching = false;
        let gameActive = false;
        let teacherTimer;

        function startGame() {
            score = 0;
            lives = 3;
            gameActive = true;
            scoreDisplay.innerText = score;
            updateLives();
            overlay.style.display = 'none';
            teacherCycle();
        }

        // Random Teacher behavior loop
        function teacherCycle() {
            if (!gameActive) return;

            // Teacher looks away (Safe)
            isTeacherWatching = false;
            teacherEmoji.innerText = "👨‍🏫";
            alertBanner.innerText = "🟢 Teacher writing on board. Copy now!";
            alertBanner.style.color = "#10b981";
            cheatBtn.classList.remove('danger');

            let safeTime = Math.random() * 2500 + 1500; // 1.5 to 4 seconds

            teacherTimer = setTimeout(() => {
                if (!gameActive) return;

                // Teacher turns around (Danger!)
                isTeacherWatching = true;
                teacherEmoji.innerText = "👀💢";
                alertBanner.innerText = "🚨 TEACHER TURNED AROUND!";
                alertBanner.style.color = "#ef4444";
                cheatBtn.classList.add('danger');

                // If student is cheating right at this moment -> CAUGHT!
                if (isCheating) {
                    caughtByTeacher();
                }

                let dangerTime = Math.random() * 1500 + 1000; // 1 to 2.5 seconds
                teacherTimer = setTimeout(teacherCycle, dangerTime);

            }, safeTime);
        }

        function startCheating() {
            if (!gameActive) return;
            isCheating = true;
            studentEmoji.innerText = "😈📜"; // Cheating with bit

            if (isTeacherWatching) {
                caughtByTeacher();
            } else {
                // Earning score while safe
                window.cheatInterval = setInterval(() => {
                    if (isCheating && !isTeacherWatching && gameActive) {
                        score += 1;
                        scoreDisplay.innerText = score;
                        if (score >= 10) {
                            endGame(true);
                        }
                    }
                }, 300);
            }
        }

        function stopCheating() {
            isCheating = false;
            studentEmoji.innerText = "🧑‍🎓";
            clearInterval(window.cheatInterval);
        }

        function caughtByTeacher() {
            isCheating = false;
            clearInterval(window.cheatInterval);
            studentEmoji.innerText = "😭🚨";
            lives--;
            updateLives();

            alertBanner.innerText = "💥 CAUGHT RED-HANDED BY TEACHER!";
            alertBanner.style.color = "#ef4444";

            if (lives <= 0) {
                endGame(false);
            }
        }

        function updateLives() {
            livesDisplay.innerText = "❤️".repeat(lives);
        }

        function endGame(isWin) {
            gameActive = false;
            clearTimeout(teacherTimer);
            clearInterval(window.cheatInterval);
            overlay.style.display = 'flex';

            if (isWin) {
                overlayTitle.innerText = "🎉 EXAM PASSED TOP RANK!";
                overlayTitle.style.color = "#10b981";
                overlayDesc.innerText = "Amazing! You successfully copied all answers and fooled the teacher!";
            } else {
                overlayTitle.innerText = "🚨 DEBARRED FROM EXAM!";
                overlayTitle.style.color = "#ef4444";
                overlayDesc.innerText = "Teacher caught you copying too many times! Better luck next semester.";
            }
        }
    </script>
</body>
</html>
